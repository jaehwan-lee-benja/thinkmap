<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>spend 마이그 스모크 · ThinkMap</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  body { margin: 0; padding: 20px; max-width: 640px; margin: 0 auto; line-height: 1.6; }
  h1 { font-size: 20px; }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid #8884; }
  .k { flex: 1 1 auto; font-weight: 700; }
  .v { font-variant-numeric: tabular-nums; font-weight: 800; }
  .ok { color: #2E9A3E; } .no { color: #BA1A1A; } .dim { opacity: .6; }
  #verdict { margin-top: 18px; padding: 14px; border: 2px solid currentColor; border-radius: 10px; font-weight: 800; }
  small { display: block; opacity: .7; font-weight: 400; font-size: 13px; }
</style>
</head>
<body>
<h1>spend 마이그 적용 전 스모크</h1>
<p class="dim">이 페이지는 <b>회원님이 이미 로그인한 세션</b>으로 함수 3개를 실제 호출합니다.
SQL Editor 는 JWT 컨텍스트가 없어 못 쓰는 검사라, 브라우저에서만 진실이 나옵니다.</p>

<div id="rows"></div>
<div id="verdict">확인 중…</div>
<p class="dim"><small>결과를 그대로 캡처해 보내주시면 됩니다. 이 페이지는 아무것도 바꾸지 않습니다(읽기만).</small></p>

<script>
const URL = 'https://sqisntxippjzcekyhqyo.supabase.co'
// anon 키는 공개 전제(프론트 번들에 이미 실려 나간다). 세션은 아래 localStorage 에서 «빌려온다».
// anon 키는 설계상 공개다(모든 위성 번들에 이미 실려 나간다). 여기 두는 것이 새 노출이 아니다.
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxaXNudHhpcHBqemNla3locXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyMDYyMzQsImV4cCI6MjA4MTc4MjIzNH0.wMdFeuYbxBJnJUeON0ccOiULDhEA88R25ewnIeb9dPg'

const rows = document.getElementById('rows')
const verdict = document.getElementById('verdict')
const put = (k, v, cls, note) => {
  rows.insertAdjacentHTML('beforeend',
    `<div class="row"><span class="k">${k}${note ? `<small>${note}</small>` : ''}</span><span class="v ${cls}">${v}</span></div>`)
}

// ★2026-08-14 2차 실패의 원인을 여기서 잡는다.
//   1차 수정 후에도 PostgREST 가 401 PGRST301 을 냈는데, 내가 두 메시지를 실험으로 갈라 보니:
//     · "None of the keys was able to decode"  = 키는 찾았고 «서명»이 안 맞음
//     · "No suitable key was found to decode"  = 키 «탐색» 자체 실패 (kid 있음 / 비대칭 alg)
//   회원님이 받은 건 «후자»다. 이 프로젝트 JWKS 는 비어 있어(대칭키) 정상 토큰이면 전자가 나와야 한다.
//   ⇒ **다른 프로젝트/낡은 항목의 토큰을 집었을 가능성**이 크다.
//   그래서 이제 «전부 나열하고, 이 프로젝트 것만 고른다».
const REF = 'sqisntxippjzcekyhqyo'
function decode(t) {
  try {
    // ★2026-08-15 결함 수정 — 패딩을 '===' 로 «고정»해 붙이고 있었다.
    //   브라우저 atob(forgiving-base64)은 «길이 %4 == 0 일 때만» 뒤 '=' 를 벗긴다.
    //   그래서 세그먼트 길이가 무엇이든(%4=0·2·3) 남은 '=' 또는 len%4==1 로 «항상» 던졌다
    //   ⇒ 모든 토큰이 파싱 실패 → ref·alg undefined → 전 항목 «다른 프로젝트» → 영구 «유효 세션 없음».
    //   필요한 만큼만 붙인다.
    const pad = (x) => x + '='.repeat((4 - (x.length % 4)) % 4)
    const [h, p] = t.split('.').slice(0, 2).map((x) => JSON.parse(atob(pad(x.replace(/-/g, '+').replace(/_/g, '/')))))
    return { h, p }
  } catch { return null }
}
function findSessions() {
  const out = []
  for (const k of Object.keys(localStorage)) {
    if (!/^sb-/.test(k)) continue
    let v = localStorage.getItem(k)
    try { if (v.startsWith('base64-')) v = atob(v.slice(7)) } catch {}
    let o; try { o = JSON.parse(v) } catch { continue }
    const tok = o?.access_token || o?.currentSession?.access_token
    if (!tok) continue
    const d = decode(tok)
    // ★2026-08-15 2차 수정 — 프로젝트 귀속을 payload.ref 로 보고 있었다.
    //   그런데 **유저 access token 에는 ref 클레임이 «없다»**(실측: ref 는 anon/service «API 키» 의 클레임이다).
    //   ⇒ 항상 undefined → 살아있는 세션이 있어도 영영 «다른 프로젝트» 로 찍혔다. 표기 버그가 아니라 «차단» 결함.
    //   귀속은 두 곳에만 있다: ⑴localStorage 키 이름 ⑵iss URL. 둘을 «교차»로 본다.
    const byKey = k.startsWith('sb-' + REF + '-')
    const iss = d?.p?.iss || ''
    const byIss = iss.startsWith('https://' + REF + '.supabase.co')
    // 둘이 어긋나면 판정하지 않는다(어느 한쪽만 믿으면 그게 다음 사고다).
    const mine = (byKey && byIss) ? true : (byKey || byIss) ? null : false
    out.push({ key: k, token: tok, alg: d?.h?.alg, kid: d?.h?.kid, mine, byKey, byIss, iss,
               email: d?.p?.email, exp: d?.p?.exp,
               expired: d?.p?.exp ? d.p.exp * 1000 < Date.now() : null,
               audience: d?.p?.app_metadata?.audience })
  }
  return out
}

const run = async () => {
  const all = findSessions()
  put('localStorage 세션 항목', `${all.length}개`, all.length ? 'ok' : 'no',
      all.length > 1 ? '★여러 개다 — 낡은 항목을 집으면 401 이 난다' : '')
  for (const a of all) {
    const who = a.mine === true ? '이 프로젝트' : a.mine === false ? '★다른 프로젝트' : '★판정 없음(키↔iss 불일치)'
    put(`· ${a.key}`, `${who} · alg=${a.alg}${a.kid ? ` · kid=${a.kid.slice(0,8)}…` : ' · kid없음'}${a.expired ? ' · ★만료' : ''}`,
        a.mine === true && !a.expired ? 'ok' : 'no', `${a.email || ''}${a.mine === null ? ` · key=${a.byKey} iss=${a.byIss}` : ''}`)
  }
  // ★이 프로젝트 것 중 «만료 안 된» 것만 쓴다. 이게 2차 실패의 교정점이다.
  const sess = all.find((a) => a.mine === true && !a.expired) || all.find((a) => a.mine === true)
  if (!sess) {
    verdict.textContent = '✗ 이 프로젝트의 유효한 세션이 없습니다 — thinkmap 에 로그인한 뒤 다시 열어주세요'
    verdict.className = 'no'; return
  }
  put('사용할 세션', `${sess.key}`, 'ok', sess.email || '')
  put('토큰 audience 클레임', sess.audience ?? '없음', sess.audience === 'staff' ? 'ok' : 'no',
      sess.audience === 'staff' ? '' : '★없으면 is_staff() 가 false → spend 전체가 0행')

  // ★supabase-js 를 쓰지 않는다 — 2026-08-14 1차 스모크가 «No suitable key or wrong key type» 로 죽었다.
  //   원인: esm.sh 의 `@supabase/supabase-js@2` 가 최신(2.112.3)을 주는데 그 버전이 JWKS 로 로컬 검증을 시도하고,
  //   이 프로젝트의 JWKS 는 **비어 있다**(`{"keys":[]}` — 레거시 HS256 대칭키). 모선은 2.89.0 을 번들해 멀쩡했다.
  //   ⇒ «떠 있는 최신»에 의존한 것이 결함이었다. 라이브러리를 빼면 그 축 자체가 사라진다.
  const call = async (fn) => {
    const r = await fetch(`${URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: `Bearer ${sess.token}`, 'content-type': 'application/json' },
      body: '{}',
    })
    const t = await r.text()
    if (!r.ok) return { error: `HTTP ${r.status} ${t.slice(0, 120)}` }
    try { return { data: JSON.parse(t) } } catch { return { data: t } }
  }

  const results = {}
  for (const fn of ['is_staff', 'is_master', 'current_workspace']) {
    const { data, error } = await call(fn)
    if (error) { results[fn] = null; put(`${fn}()`, error, 'no') }
    else { results[fn] = data; put(`${fn}()`, String(data), (data === true || (fn === 'current_workspace' && data)) ? 'ok' : 'no') }
  }

  const pass = results.is_staff === true && results.is_master === true && !!results.current_workspace
  verdict.textContent = pass
    ? '✓ 통과 — 셋 다 참/비null 입니다. 마이그를 적용해도 됩니다.'
    : '✗ 미통과 — 이대로 적용하면 spend 가 «0행»으로 태어납니다. 캡처해 보내주세요.'
  verdict.className = pass ? 'ok' : 'no'
}
run().catch((e) => { verdict.textContent = '오류: ' + e.message; verdict.className = 'no' })
</script>
</body>
</html>
