name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Phase 1 데일리 이월 Edge 경로 활성화. .env 는 보안상 미추적(22385cb)이라
          # CI 빌드엔 안 들어가므로 여기서 명시 주입한다. (PHASE1-deploy-verify.md)
          VITE_USE_EDGE_DAILY: 'true'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # ★keep_files: CI는 모선(dist)만 빌드·배포한다. SITE-SPLIT 위성(payroll/inventory/canvas/seat/members)은
          #   gh-pages 하위폴더에 수동 배포(위성별 `-e <sub> --add`)되므로, 여기서 브랜치를 교체하면(기본값)
          #   위성이 매 push마다 wipe된다. keep_files=true 로 기존 파일(=위성 하위폴더)을 보존한다.
          #   (위성이 바뀌면 통합세션이 수동 재배포. 상세: docs/SITE-SPLIT-PLAN.md 배포절)
          keep_files: true
