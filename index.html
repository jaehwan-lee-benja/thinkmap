<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#242424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ThinkMap" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>ThinkMap</title>
    <script type="module" crossorigin src="/thinkmap/assets/index-C3yYYoXa.js"></script>
    <link rel="stylesheet" crossorigin href="/thinkmap/assets/index-BdN86ik2.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="dbg" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:rgba(0,0,0,0.9);color:#0f0;font:11px/1.4 monospace;padding:6px 8px;pointer-events:none;white-space:pre-wrap;max-height:40vh;overflow:auto;"></div>
    <script>
      // React 외부 에러 캐처 — React 크래시도 잡음
      var dbg=document.getElementById('dbg'),logs=[];
      function dlog(m){logs.push(m);if(logs.length>20)logs.shift();dbg.textContent=logs.join('\n');}
      window.onerror=function(m,s,l,c,e){dlog('ERR:'+m+' @'+s+':'+l);};
      window.onunhandledrejection=function(e){dlog('REJECT:'+String(e.reason).slice(0,200));};
      // 엘리먼트 높이 모니터링
      setInterval(function(){
        var a=document.querySelector('.app'),cn=document.querySelector('.container'),
            p=document.querySelector('.pane'),pa=document.querySelector('.pane-content-area'),
            cs=document.querySelector('.content-scrollable'),r=document.getElementById('root');
        dlog('h:vh='+window.innerHeight+' root='+((r&&r.offsetHeight)||0)+' app='+(a?a.offsetHeight:0)+' cont='+(cn?cn.offsetHeight:0)+' pane='+(p?p.offsetHeight:0)+' pca='+(pa?pa.offsetHeight:0)+' cs='+(cs?cs.offsetHeight:0)+' ch='+((r&&r.children.length)||0));
      },800);
    </script>
  </body>
</html>
